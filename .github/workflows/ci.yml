name: Verificar extensão
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ardonia-cinematic-entrega
          path: artifacts/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-navegador
          path: test-results/
